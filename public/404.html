<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>AI Video Maker</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects deep links to index.html with query parameters
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var pathSegments = l.pathname.split('/');
      // If deployed at root (custom domain) pathSegmentsToKeep = 0, if repo subfolder pathSegmentsToKeep = 1
      var isSubfolder = pathSegments.length > 2 && pathSegments[1] !== '';
      var keep = isSubfolder ? 1 : 0;
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        pathSegments.slice(0, 1 + keep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(keep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background-color: #050811; color: #94a3b8; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to AI Video Maker...</p>
  </body>
</html>
